name: basirah
description: "Islamic Companion App - Your Daily Spiritual Guide"
publish_to: 'none'

version: 0.1.0-dev+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.7

  # Prayer Times Calculation
  adhan: ^2.0.0

  # Location Services
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # Sensors (Qibla Compass)
  flutter_compass: ^0.8.0
  sensors_plus: ^6.0.1

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Date & Time
  intl: any
  hijri: ^3.0.0

  # UI Components
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  confetti: ^0.7.0

  # Utilities
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  
  # App Icon Generator
  flutter_launcher_icons: ^0.14.3
  
  # Native Splash Screen
  flutter_native_splash: ^2.4.5

flutter:
  generate: true
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

  # Fonts - TODO: Add font files
