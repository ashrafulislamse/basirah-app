# App Icon Configuration
# Run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon_combined.png"
  adaptive_icon_foreground: "assets/icons/basirah-icon.png"
  adaptive_icon_background: "assets/icons/appiconbg.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icons/app_icon_combined.png"
    background_color: "#0D4D4D"
    theme_color: "#0D4D4D"

# Native Splash Screen Configuration
# Run: dart run flutter_native_splash:create
# Simple: Dark background + logo only (Android 12+ doesn't support background images well)
# Flutter splash will animate in the pattern from this state
flutter_native_splash:
  # Dark background (same as Flutter splash starting color)
  color: "#0F2027"
  
  # Logo centered on dark background
  image: "assets/icons/basirah-icon.png"
  
  # Android 12+ settings
  android_12:
    color: "#0F2027"
    image: "assets/icons/basirah-icon.png"
    icon_background_color: "#0F2027"
  
  # iOS settings
  ios: true
  
  # Web settings
  web: false
  
  # Full screen mode
  fullscreen: true

